[package]
name = "slate-executor"
version = "0.1.0"
edition = "2024"

[features]
# Exposes `slate_executor::bench` (thin `pub` wrappers over the `pub(crate)`
# node executors + a seeded-engine fixture) so `benches/nodes.rs` can drive each
# node in isolation. The fixture builds a `KvEngine<MemoryStore>` in library
# code, and dev-deps aren't visible there, so the memory store is an optional
# normal dependency activated by this feature rather than `[]`.
bench-internals = ["dep:slate-store"]
# Emit `tracing` spans/events at the execution seams (plan dispatch, store-backed
# sources). OFF by default and wasm-safe: with the feature off, `tracing` is not a
# dependency and the `trace_span!`/event call sites expand to nothing, so the
# default build carries zero instrumentation cost. The host wires its own
# subscriber.
trace = ["dep:tracing"]

[dependencies]
bson = { workspace = true }
slate-ast = { path = "../slate-ast" }
slate-eval = { path = "../slate-eval" }
slate-udf = { path = "../slate-udf" }
slate-validator = { path = "../slate-validator" }
slate-trigger = { path = "../slate-trigger" }
slate-planner = { path = "../slate-planner" }
slate-engine = { path = "../slate-engine" }
slate-rawbson = { path = "../slate-rawbson" }
# Optional: only pulled in by the `trace` feature. `default-features = false`
# keeps it lean — the executor only *emits*; the host owns the subscriber.
tracing = { version = "0.1", optional = true, default-features = false, features = [
    "std",
] }
slate-store = { path = "../slate-store", features = ["memory"], optional = true }

[dev-dependencies]
slate-sql = { path = "../slate-sql" }
slate-store = { path = "../slate-store", features = ["memory"] }
# Also listed as dev-deps so the external `nodes` bench target can name them
# directly (they are regular deps too; Cargo dedups).
slate-engine = { path = "../slate-engine" }
slate-planner = { path = "../slate-planner" }
slate-eval = { path = "../slate-eval" }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "nodes"
harness = false
required-features = ["bench-internals"]
