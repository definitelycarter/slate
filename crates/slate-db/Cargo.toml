[package]
name = "slate-db"
version = "0.1.0"
edition = "2024"

[features]
default = ["lua", "runtime"]
# `runtime` pulls in the native, OS-dependent pieces (background TTL sweep, and
# the default seeded PRNG behind `RAND()`). It is deliberately OFF in the wasm
# build (`default-features = false`) so `rand`/`getrandom` never reach
# wasm32-unknown-unknown — the wasm host injects its own sources instead.
runtime = ["dep:rand"]
bench-internals = []
lua = ["slate-vm/lua"]
js = ["slate-vm/js"]
# Feature-gated `tracing` instrumentation (see the executor's `trace` feature).
# OFF by default; turns on spans/events in `slate-db` *and* `slate-executor`, so
# a host enables tracing for the whole query stack with one flag. Zero cost when
# off — `tracing` is not pulled in.
trace = ["dep:tracing", "slate-executor/trace"]

[dependencies]
slate-engine = { path = "../slate-engine" }
slate-store = { path = "../slate-store", default-features = false }
slate-query = { path = "../slate-query" }
slate-ast = { path = "../slate-ast" }
slate-planner = { path = "../slate-planner" }
slate-executor = { path = "../slate-executor" }
slate-udf = { path = "../slate-udf" }
slate-validator = { path = "../slate-validator" }
slate-sql = { path = "../slate-sql" }
slate-vm = { path = "../slate-vm" }
serde = { version = "1", features = ["derive"] }
bson = { workspace = true }
regex = "1"
arc-swap = "1.8.2"
# Optional: only via the `trace` feature. `default-features = false` keeps it
# lean — `slate-db` only emits; the host owns the subscriber.
tracing = { version = "0.1", optional = true, default-features = false, features = [
    "std",
] }
# Native default random source for `RAND()` (a seeded `SmallRng`). Optional and
# gated by `runtime` so it is excluded from the wasm build; `small_rng` selects
# the lightweight non-crypto PRNG.
rand = { version = "0.8", features = ["small_rng"], optional = true }


[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
rand = "0.8"
# `memory` for the bulk of the suite; `rocksdb`/`redb` for the durability +
# crash-recovery tests, which need a persistent backend to survive a reopen.
slate-store = { path = "../slate-store", features = ["memory", "rocksdb", "redb"] }
# Cosmos golden-replay parity (tests/cosmos_golden.rs): compare slate's
# relaxed-extjson output against committed Cosmos goldens.
serde_json = "1"
bson = { workspace = true, features = ["serde_json-1"] }

[[bench]]
name = "find"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "query"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "write"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "distinct"
harness = false
required-features = ["bench-internals"]
