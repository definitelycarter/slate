name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref (saves runner time on rapid pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      # Default features (memory + lua + runtime) — RocksDB is opt-in and not
      # built here, so no system libclang is needed. Runs the full unit +
      # integration suite, including the hermetic Cosmos golden replay
      # (crates/slate-db/tests/cosmos_golden.rs, which asserts on divergence).
      - name: Test
        run: cargo test --workspace

      # clippy is intentionally not a gate yet: the workspace has pre-existing
      # warnings plus a handful of deny-by-default `approx_constant` findings in
      # test code. Once those are cleaned up, add a clippy job with
      # `-- -D warnings` to make it enforced.
