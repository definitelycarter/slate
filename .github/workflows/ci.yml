name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref (saves runner time on rapid pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Default features (memory + lua + runtime) — RocksDB is opt-in and not
      # built here, so no system libclang is needed. Runs the full unit +
      # integration suite, including the hermetic Cosmos golden replay
      # (crates/slate-db/tests/cosmos_golden.rs, which asserts on divergence).
      - name: Test
        run: cargo test --workspace

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Guards the scripting decoupling: slate-wasm takes slate-db with
      # default-features off (lua excluded), so mlua's vendored C — which can't
      # target wasm32 — never reaches the build. If someone re-forces a lua
      # feature into the query stack, this job fails. This checks that the
      # target compiles, not lint-cleanliness (the `check` job already enforces
      # clippy `-D warnings` on the host build), so plain `cargo build` is used.
      #
      # This is also the guard that the book's committed playground bundle
      # (book/src/playground/pkg) can still be rebuilt from source — the `book`
      # job below only consumes the prebuilt artifact.
      - name: Build slate-wasm for wasm32
        run: cargo build -p slate-wasm --target wasm32-unknown-unknown

  book:
    name: mdbook build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The book embeds a prebuilt slate-wasm bundle (book/src/playground/pkg),
      # so building it needs only mdbook — no Rust/wasm toolchain. Install the
      # prebuilt mdbook binary rather than `cargo install` (which would compile
      # it) to keep this job fast.
      - name: Install mdbook
        env:
          MDBOOK_VERSION: "0.5.2"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Verifies the book — including the committed playground bundle — builds.
      - name: Build the book
        run: mdbook build book
