name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref (saves runner time on rapid pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Default features (memory + lua + runtime) — RocksDB is opt-in and not
      # built here, so no system libclang is needed. Runs the full unit +
      # integration suite, including the hermetic Cosmos golden replay
      # (crates/slate-db/tests/cosmos_golden.rs, which asserts on divergence).
      - name: Test
        run: cargo test --workspace
